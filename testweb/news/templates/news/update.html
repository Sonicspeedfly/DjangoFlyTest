{% extends 'main/layout.html' %}

{% block title %}Форма по отредактированию статьи{% endblock %}

{% block content %}
    <div class="features">
        <h1>Форма по отредактированию статьи</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.title }}<br>
            {{ form.anons }}<br>
            {{ form.full_text }}<br>
            {{ form.data }}<br>
            <span>{{ error }}</span><br>
            <button class="btn btn-success" type="submit">Отредактировать статью</button>
        </form>
    </div>
{% endblock %}
